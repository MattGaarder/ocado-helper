<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Ocado Helper</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="panel">
        <div class="toolbar">
            <span class="title">🛒 Ocado Helper</span>
            <div class="actions">
                <input type="file" id="pdfUpload" accept="application/pdf" hidden>
                <button type="button" id="uploadButton" class="btn btn-primary">
                    <span aria-hidden="true">⤒</span> Upload receipt
                </button>
                <button type="button" id="syncButton" class="btn">
                    <span aria-hidden="true">⟳</span> Sync with Notion
                </button>
            </div>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
        <ul id="results" class="results"></ul>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./pdf.js"></script>
    <script src="./script.js"></script>
</body>
</html>
